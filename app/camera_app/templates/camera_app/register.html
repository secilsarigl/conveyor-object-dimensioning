<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            background: linear-gradient(135deg, #0f4c5c 0%, #2c7a7b 50%, #e3b23c 100%);
 

        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .container h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .container input[type="text"],
        .container input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .container button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .container button:hover {
            background-color: #0056b3;
        }

        .container p.error {
            font-size: 12px;
            color: #ff0000;
            margin-top: 5px;
            display: none; /* Başlangıçta hata mesajlarını gizle */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kayıt Ol</h1>
        <form id="register-form" method="post">
            {% csrf_token %}
            <div class="form-field">
                <label for="id_username">Kullanıcı Adı:</label>
                <input type="text" name="username" id="id_username" maxlength="150" required>
                <p class="error" id="username-error"></p>
            </div>
            <div class="form-field">
                <label for="id_password1">Şifre:</label>
                <input type="password" name="password1" id="id_password1" required>
                <p class="error" id="password-error"></p>
            </div>
            <div class="form-field">
                <label for="id_password2">Şifreyi Onayla:</label>
                <input type="password" name="password2" id="id_password2" required>
                <p class="error" id="password2-error"></p>
            </div>
            {% if form.errors %}
                <div class="error">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}<p>{{ error }}</p>{% endfor %}
                    {% endfor %}
                </div>
            {% endif %}
            <button type="submit">Kayıt Ol</button>
        </form>
    </div>
</body>
</html>
